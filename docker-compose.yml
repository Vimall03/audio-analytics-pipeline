services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    platform: linux/amd64
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: audio-analytics-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg2://myuser:mypassword@postgres:5432/mydb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  celery:
    build: .
    container_name: audio-analytics-celery
    entrypoint: ["/app/celery-entrypoint.sh"]
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg2://myuser:mypassword@postgres:5432/mydb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

  redis_data:



